name: STM32 Firmware CI/CD with Renode

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Хук для удаления ТОЛЬКО однострочных комментариев из исходного кода C/C++
      - name: Remove single-line comments from C/C++ source code
        run: |
          python3 << 'EOF'
          import os, re

          def strip_single_line_comments(code):
              pattern = re.compile(
                  r'//.*?$|/\*.*?\*/|\'(?:\\.|[^\\\'])*\'|"(?:\\.|[^\\"])*"',
                  re.DOTALL | re.MULTILINE
              )
              def replacer(match):
                  s = match.group(0)
                  return "" if s.startswith("//") else s

              return re.sub(pattern, replacer, code)

          EXCLUDE_DIRS = {'.git', 'build', 'build_out', '.cache'}

          for root, dirs, files in os.walk("."):
              # Не заходим в системные и сборочные папки
              dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS]
              for file in files:
                  if file.endswith((".c", ".cpp", ".h", ".hpp")):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(strip_single_line_comments(content))
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Оптимизированный шаг: Использует кэш GitHub Actions для Docker-слоев
      - name: Build Firmware, Check Size & Run Renode Tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifacts
          outputs: type=local,dest=./build_out
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Объединенный шаг загрузки проверенных артефактов
      - name: Upload Verified Firmware & Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware-and-reports
          path: |
            build_out/UART_DRIVER.elf
            build_out/benchmark_results.png
          retention-days: 7
