name: STM32 Firmware CI/CD with Renode

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Хук для удаления ТОЛЬКО однострочных комментариев из исходного кода C/C++
      - name: Remove single-line comments from C/C++ source code
        run: |
          python3 << 'EOF'
          import os, re

          def strip_single_line_comments(code):
              # Захватываем //, /* */ и строковые литералы
              pattern = re.compile(
                  r'//.*?$|/\*.*?\*/|\'(?:\\.|[^\\\'])*\'|"(?:\\.|[^\\"])*"',
                  re.DOTALL | re.MULTILINE
              )
              def replacer(match):
                  s = match.group(0)
                  # Удаляем ТОЛЬКО однострочные комментарии
                  if s.startswith("//"):
                      return ""
                  # Многострочные комментарии (/*...*/) и строки возвращаем без изменений
                  return s

              return re.sub(pattern, replacer, code)

          # Проходим по всем файлам исходного кода
          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith((".c", ".cpp", ".h", ".hpp")):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(strip_single_line_comments(content))
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Единый шаг: Компиляция C++, проверка размера Flash и интеграционные тесты в Renode
      - name: Build Firmware, Check Size & Run Renode Tests
        run: |
          docker build --target artifacts --output type=local,dest=./build_out .

      # Загрузка проверенной и протестированной прошивки в артефакты
      - name: Upload Verified Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware-verified
          path: build_out/UART_DRIVER.elf
          retention-days: 7

      # ДОБАВЛЕНО: Загрузка графика бенчмарка в артефакты
      - name: Upload Benchmark Chart
        uses: actions/upload-artifact@v4
        with:
          name: throughput-benchmark-chart
          path: build_out/benchmark_results.png
          retention-days: 7
